[package]
name = "peakrunner"
version = "0.1.0"
edition = "2021"
description = "PeakRunner — ski and disc combat. Native on macOS and Windows, and WebAssembly."
license = "MIT"
publish = false
rust-version = "1.95"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
egui = "0.36.2"
glam = { version = "0.29", default-features = false, features = ["std"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
gilrs = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioParam",
    "BiquadFilterNode",
    "BiquadFilterType",
    "Document",
    "Element",
    "GainNode",
    "Gamepad",
    "GamepadButton",
    "HtmlCanvasElement",
    "Navigator",
    "OscillatorNode",
    "OscillatorType",
    "Window",
] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
