name: peakrunner-public
services:
  tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: peakrunner-cloudflared
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${PEAKRUNNER_TUNNEL_TOKEN:?Use cloudflare.mjs --start to supply the tunnel credential}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [public]
networks:
  public:
    name: peakrunner-public
    external: true
