name: peakrunner-match
services:
  match:
    image: ${PEAKRUNNER_IMAGE:?Set the tested immutable image tag or digest}
    command: [peakrunner-server]
    user: "10001:10001"
    environment:
      PEAKRUNNER_MATCH_NAME: Springdale Central
      PEAKRUNNER_MATCH_MAP: Raindance
      # Every CTF map in CTF, then every Capture & Hold map in Capture & Hold.
      # A football server uses '[{"playlist":"football"}]'. Explicit
      # {"map":...,"mode":...} entries still work and mix with playlists.
      PEAKRUNNER_MATCH_ROTATION: '[{"playlist":"ctf_cnh"}]'
      PEAKRUNNER_MATCH_PASSWORD: ${PEAKRUNNER_MATCH_PASSWORD:-}
    ports:
      - "7777:7777/udp"
    volumes:
      - ./secrets/certs:/run/peakrunner:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: [CMD, peakrunner-server, --healthcheck]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
