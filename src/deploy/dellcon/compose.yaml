name: peakrunner-public
services:
  site:
    image: sha256:27d69f3af6be7598b09918626be5cbf9510e58f5c6d0ebcd70fcecddfa1cf0b2
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - /data/peakrunner/downloads:/srv/downloads:ro
      - /data/peakrunner/updates:/srv/updates:ro
    tmpfs: [/config, /data]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    networks: [public]
  directory:
    build:
      context: ./source
      dockerfile: crates/directory/Dockerfile
    image: sha256:9f657f1829db1a8bebceb914b6e6d00ca11594f8317f7450b1f2afb0e69aecc9
    command: [peakrunner-directory]
    environment:
      PEAKRUNNER_HTTP_BIND: 0.0.0.0:8080
      PEAKRUNNER_TRUST_CLOUDFLARE: "1"
      PEAKRUNNER_STATUS_URL: quic://play.peakrunner.net:7777
      PEAKRUNNER_PUBLIC_URL: quic://play.peakrunner.net:7777
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, peakrunner-directory, --healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    networks: [public]
  tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: peakrunner-cloudflared
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${PEAKRUNNER_TUNNEL_TOKEN:?Use cloudflare.mjs --start to supply the tunnel credential}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [public]
networks:
  public:
    name: peakrunner-public
    external: true
