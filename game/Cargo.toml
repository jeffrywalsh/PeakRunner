[package]
name = "peakstrife"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
glam = { version = "0.29", default-features = false, features = ["std"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.104"

[dependencies.web-sys]
version = "0.3"
features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
